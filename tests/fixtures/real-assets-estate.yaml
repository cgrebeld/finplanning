schema_version: 1
household: {id: hh-test, name: "Real assets, OAS clawback and estate settlement fixture", province: BC}
persons:
  - {id: alex, name: Alex, birth_date: 1958, life_expectancy: 80, cpp_start_age: 65, oas_start_age: 65}
  - {id: sam, name: Sam, birth_date: 1960, life_expectancy: 88, cpp_start_age: 65, oas_start_age: 65}
accounts:
  - {id: alex-rrsp, owner: alex, rollover_to_spouse: false, name: Alex RRIF, type: RRSP, balance: 900000, cost_basis: 900000, asset_mix: {equity: 0.6, fixed_income: 0.4}}
  - {id: alex-tfsa, owner: alex, rollover_to_spouse: false, name: Alex TFSA, type: TFSA, balance: 150000, cost_basis: 100000, asset_mix: {equity: 0.8, fixed_income: 0.2}}
  - {id: sam-rrsp, owner: sam, name: Sam RRIF, type: RRSP, balance: 700000, cost_basis: 700000, asset_mix: {equity: 0.6, fixed_income: 0.4}}
  - {id: sam-tfsa, owner: sam, name: Sam TFSA, type: TFSA, balance: 150000, cost_basis: 100000, asset_mix: {equity: 0.8, fixed_income: 0.2}}
  - {id: alex-nonreg, owner: alex, rollover_to_spouse: false, name: Alex NR, type: NON_REGISTERED, balance: 600000, cost_basis: 400000, asset_mix: {equity: 0.7, fixed_income: 0.3}}
  - {id: joint-nonreg, owner: joint, name: Joint NR, type: NON_REGISTERED, balance: 1500000, cost_basis: 900000, asset_mix: {equity: 0.7, fixed_income: 0.3}}
real_assets:
  - id: home
    name: Home
    type: PRIMARY_RESIDENCE
    ownership_shares: {alex: 0.5, sam: 0.5}
    fair_market_value: 1500000
    valuation_year: 2026
    appreciation: {method: FIXED_NOMINAL, annual_rate: 0.03}
    disposition:
      strategy: DOWNSIZE_IN_YEAR
      year: 2036
      selling_cost_rate: 0.05
      proceeds_destinations: {alex: alex-nonreg, sam: joint-nonreg}
      replacement: {name: Condo, purchase_price: 900000, purchase_cost_rate: 0.02}
  - id: cabin
    name: Cabin
    type: SECONDARY_RESIDENCE
    ownership_shares: {alex: 0.5, sam: 0.5}
    acquisition:
      strategy: PURCHASE_IN_YEAR
      year: 2028
      purchase_price: 800000
      purchase_costs: {method: BC_PROPERTY_TRANSFER_TAX_V1, other_capitalized_costs: 5000}
      funding_sources:
        - {account_id: joint-nonreg, amount: 300000}
        - {account_id: alex-nonreg}
    appreciation: {method: FIXED_NOMINAL, annual_rate: 0.05}
    disposition:
      strategy: SELL_IN_YEAR
      year: 2033
      selling_cost_rate: 0.04
      proceeds_destinations: {alex: alex-nonreg, sam: joint-nonreg}
income:
  - {id: alex-pension, owner: alex, name: DB Pension, type: PENSION, annual_amount: 160000, start_date: 2026, is_eligible_for_splitting: true}
  - {id: sam-pension, owner: sam, name: DB Pension, type: PENSION, annual_amount: 140000, start_date: 2026, is_eligible_for_splitting: true}
expenses:
  - {id: essential, name: Essential, category: ESSENTIAL, annual_amount: 120000}
  - {id: travel, name: Travel, category: DISCRETIONARY, annual_amount: 40000}
one_time_events:
  - {id: gift, name: Inheritance, type: income, amount: 100000, year: 2030}
  - {id: car, name: Car, type: expense, amount: 60000, year: 2031}
recurring_expenses:
  - {id: reno, name: Reno, amount: 20000, start_year: 2027, period_years: 5}
assumptions:
  returns: {equity: 0.06, fixed_income: 0.03, cash: 0.02}
  inflation: 0.02
  withdrawal_order: [NON_REGISTERED, RRSP, TFSA]
  investment_income_model: {equity_dividend_yield: 0.02, fixed_income_distribution_yield: 0.035, cash_interest_yield: 0.02, capital_gains_inclusion_rate: 0.5}
scenarios:
  - {id: base, name: Base, is_base_case: true}
